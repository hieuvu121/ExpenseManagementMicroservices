apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: expenshie-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Must match global.scrape_interval in prometheus.yml, or Grafana picks
      # step values that alias the data.
      timeInterval: 15s
